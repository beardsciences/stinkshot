[package]
name = "stinkshot"
description = "Stinkshot: local-first screenshot and screen recording for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "stinkshot"
path = "src/main.rs"

[features]
# Hidden `stinkshot soak ...` IPC commands for the soak and leak test
# (C:\dev\stinkshot-bench\soak). Never enabled in release builds.
soak = []

[dependencies]
stinkshot-core.workspace = true
stinkshot-stitch.workspace = true
stinkshot-history.workspace = true
stinkshot-platform.workspace = true
stinkshot-record.workspace = true
stinkshot-logo.workspace = true
anyhow.workspace = true
log.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe.workspace = true
egui.workspace = true
tray-icon.workspace = true
global-hotkey.workspace = true
clap.workspace = true
# Blocks on wgpu adapter and device requests in `gpu.rs` (already in the tree via eframe).
pollster.workspace = true
ureq.workspace = true
minisign-verify.workspace = true
# PNG frames of the About animation's disk cache (already in the tree via eframe and core).
image.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3.0.12"
stinkshot-logo.workspace = true

[dev-dependencies]
gif.workspace = true

# examples/scroll_harness.rs draws its test window with GDI.
[target.'cfg(windows)'.dev-dependencies.windows]
workspace = true
features = ["Win32_Graphics_Gdi", "Win32_UI_Controls"]
