[package]
name = "stinkshot"
description = "Stinkshot: local-first screenshot and screen recording for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "stinkshot"
path = "src/main.rs"

[dependencies]
stinkshot-core.workspace = true
stinkshot-stitch.workspace = true
stinkshot-history.workspace = true
stinkshot-platform.workspace = true
stinkshot-record.workspace = true
stinkshot-logo.workspace = true
anyhow.workspace = true
log.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe.workspace = true
egui.workspace = true
tray-icon.workspace = true
global-hotkey.workspace = true
clap.workspace = true
ureq.workspace = true
# PNG frames of the About animation's disk cache (already in the tree via eframe and core).
image.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3.0.12"
stinkshot-logo.workspace = true

[dev-dependencies]
gif.workspace = true

# examples/scroll_harness.rs draws its test window with GDI.
[target.'cfg(windows)'.dev-dependencies.windows]
workspace = true
features = ["Win32_Graphics_Gdi", "Win32_UI_Controls"]
