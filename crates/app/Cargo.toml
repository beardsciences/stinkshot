[package]
name = "stinkshot"
description = "StinkShot: local-first screenshot and screen recording for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "stinkshot"
path = "src/main.rs"

[dependencies]
stinkshot-core.workspace = true
stinkshot-stitch.workspace = true
stinkshot-history.workspace = true
stinkshot-platform.workspace = true
stinkshot-record.workspace = true
anyhow.workspace = true
log.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe.workspace = true
egui.workspace = true
tray-icon.workspace = true
global-hotkey.workspace = true
clap.workspace = true
ureq.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3.0.12"
