[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/stitch",
    "crates/history",
    "crates/platform",
    "crates/record",
    "crates/logo",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://code.mccullough.dev/christian/stinkshot"
rust-version = "1.95"

[workspace.dependencies]
stinkshot-core = { path = "crates/core" }
stinkshot-stitch = { path = "crates/stitch" }
stinkshot-history = { path = "crates/history" }
stinkshot-platform = { path = "crates/platform" }
stinkshot-record = { path = "crates/record" }
stinkshot-logo = { path = "crates/logo" }

anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tiny-skia = "0.12"
ab_glyph = "0.2"
rusqlite = { version = "0.41", features = ["bundled", "chrono"] }
gif = "0.14"
imagequant = "4"
# `accesskit`: UI Automation for screen readers (root viewport; `a11y.rs` wires the rest).
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui = "0.37"
# Same version eframe's accesskit_winit uses; `a11y.rs` adapts each surface window.
accesskit_windows = "0.35"
tray-icon = "0.26"
global-hotkey = "0.9"
clap = { version = "4", features = ["derive"] }
pollster = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# Verifies the signed release manifest in the update check (pure Rust, no dependencies).
minisign-verify = "0.3"
directories = "6"
# QR and barcode reading (pure Rust zxing port); decoders only, no image / network features.
rxing = { version = "0.9", default-features = false, features = [
    "decoders",
    "multi_barcode_readers",
    "qrcode",
    "oned",
    "datamatrix",
    "aztec",
    "pdf417",
    "encoding_rs",
] }
windows = "0.62"
png = "0.18"
memmap2 = "0.9"
miniz_oxide = "0.8"
crc32fast = "1"
zopfli = { version = "0.8", default-features = false, features = ["std", "zlib"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.stinkshot-record]
opt-level = 3

# Screen capture converts every pixel of the desktop (FP16 HDR tone mapping, swizzles) on each
# freeze. Unoptimized that is about 1 s per freeze, which makes dev builds useless for judging
# overlay latency; optimized it matches release (tens of ms).
[profile.dev.package.stinkshot-platform]
opt-level = 2

# Full-desktop `Rgba` fills and blits on the same path.
[profile.dev.package.stinkshot-core]
opt-level = 2

# The logo renderer runs in build.rs (exe icon, tray bitmaps) and on a worker thread for the
# About animation; optimized it takes about a second, unoptimized it would take minutes.
[profile.dev.package.stinkshot-logo]
opt-level = 3

# Release builds compile build-script dependencies at opt-level 0 by default.
[profile.release.package.stinkshot-logo]
opt-level = 3
