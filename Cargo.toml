[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/stitch",
    "crates/history",
    "crates/platform",
    "crates/record",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://code.mccullough.dev/beard/stinkshot"
rust-version = "1.95"

[workspace.dependencies]
stinkshot-core = { path = "crates/core" }
stinkshot-stitch = { path = "crates/stitch" }
stinkshot-history = { path = "crates/history" }
stinkshot-platform = { path = "crates/platform" }
stinkshot-record = { path = "crates/record" }

anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tiny-skia = "0.12"
ab_glyph = "0.2"
rusqlite = { version = "0.41", features = ["bundled", "chrono"] }
gif = "0.14"
imagequant = "4"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.37"
tray-icon = "0.26"
global-hotkey = "0.9"
clap = { version = "4", features = ["derive"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
directories = "6"
windows = "0.62"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
