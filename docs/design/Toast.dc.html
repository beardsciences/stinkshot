<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stinkshot after-capture toast</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#7fd36a}a:hover{color:#a6e596}
</style>
</helmet>
<div style="width: 420px; height: 250px; box-sizing: border-box; padding: 20px; background: #15191f; font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif; color: #ffffff; display: flex; align-items: flex-end">
  <div style="width: 380px; box-sizing: border-box; background: #2c2c2c; border: 1px solid rgba(255,255,255,0.09); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,0.5); padding: 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 12px; align-items: flex-start">
      <div aria-hidden="true" style="width: 96px; height: 60px; border-radius: 6px; background: linear-gradient(135deg, #2a3a4c, #1e1e1e); border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; position: relative; overflow: hidden">
        <div style="position: absolute; left: 10px; top: 12px; width: 50px; height: 5px; background: #dcdcaa; border-radius: 2px"></div>
        <div style="position: absolute; left: 10px; top: 22px; width: 64px; height: 5px; background: #6a5246; border-radius: 2px"></div>
        <div style="position: absolute; left: 58px; top: 32px; width: 14px; height: 14px; border-radius: 50%; background: {{accent}}"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0">
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #c8c8c8">
          <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: {{accent}}"></span>Stinkshot
        </div>
        <div style="font-size: 14px; font-weight: 600">Copied to Clipboard</div>
        <div style="font-size: 12px; color: #b4b4b4">760 × 420 · Editor · Saved to History</div>
      </div>
      <button aria-label="Dismiss" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #c8c8c8; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <button style="height: 34px; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; background: #373737; color: #ffffff; font-family: inherit; font-size: 13px">Edit</button>
      <button style="height: 34px; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; background: #373737; color: #ffffff; font-family: inherit; font-size: 13px">Pin</button>
      <button style="height: 34px; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; background: #373737; color: #ffffff; font-family: inherit; font-size: 13px">Copy Text</button>
      <button style="height: 34px; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; background: #373737; color: #ffffff; font-family: inherit; font-size: 13px">Folder</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7fd36a","options":["#7fd36a","#4cc2ff","#ffb454","#c49cff"]},"$preview":{"width":420,"height":250}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#7fd36a' };
  }
}
</script>
</body>
</html>
