<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StinkShot history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#7fd36a}a:hover{color:#a6e596}
</style>
</helmet>
<div style="width: 1280px; height: 820px; box-sizing: border-box; background: #202020; font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif; color: #ffffff; display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08)">
  <div style="height: 44px; display: flex; align-items: center; padding: 0 16px; gap: 10px; font-size: 12px; color: #d0d0d0">
    <span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 4px; background: {{accent}}"></span>StinkShot History
  </div>
  <div style="display: flex; flex: 1; min-height: 0">
    <nav aria-label="Filters" style="width: 240px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; font-size: 13px">
      <a href="#" style="color: #ffffff; text-decoration: none; height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-radius: 6px; background: rgba(255,255,255,0.07)"><span>All Captures</span><span style="color: #a8a8a8">1,284</span></a>
      <a href="#" style="color: #ffffff; text-decoration: none; height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-radius: 6px"><span>Starred</span><span style="color: #a8a8a8">37</span></a>
      <a href="#" style="color: #ffffff; text-decoration: none; height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-radius: 6px"><span>Recordings</span><span style="color: #a8a8a8">52</span></a>
      <div style="font-size: 12px; color: #a8a8a8; padding: 16px 10px 6px">Source App</div>
      <sc-for list="{{apps}}" as="app" hint-placeholder-count="5">
        <a href="#" style="color: #ffffff; text-decoration: none; height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-radius: 6px"><span>{{app.name}}</span><span style="color: #a8a8a8">{{app.count}}</span></a>
      </sc-for>
      <div style="margin-top: auto; padding: 12px 10px; font-size: 12px; color: #a8a8a8; line-height: 1.5">Keeping 90 days or 5 GB, starred kept forever. 2.1 GB used.</div>
    </nav>
    <main style="flex: 1; min-width: 0; background: #272727; border-top-left-radius: 8px; border-top: 1px solid rgba(255,255,255,0.06); border-left: 1px solid rgba(255,255,255,0.06); padding: 18px 22px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; gap: 10px; align-items: center">
        <label style="flex: 1; display: flex; align-items: center; gap: 8px; height: 36px; background: #1f1f1f; border: 1px solid rgba(255,255,255,0.1); border-bottom: 2px solid {{accent}}; border-radius: 6px; padding: 0 12px">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c8c8c8" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6"></circle><path d="M16 16l4 4"></path></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search Captures</span>
          <input value="invoice 4471" style="flex: 1; border: 0; background: transparent; color: #ffffff; font-family: inherit; font-size: 14px; outline: none">
        </label>
        <button style="height: 36px; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; background: #373737; color: #ffffff; font-family: inherit; font-size: 13px; padding: 0 12px">Last 30 Days</button>
        <button style="height: 36px; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; background: #373737; color: #ffffff; font-family: inherit; font-size: 13px; padding: 0 12px">Open Folder</button>
      </div>
      <div style="font-size: 13px; color: #c8c8c8">6 captures contain text matching “invoice 4471”</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{shots}}" as="s" hint-placeholder-count="6">
          <div style="background: #2f2f2f; border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column">
            <div aria-hidden="true" style="height: 150px; background: {{s.bg}}; position: relative">
              <div style="position: absolute; left: 18px; top: 22px; width: 60%; height: 8px; border-radius: 3px; background: rgba(255,255,255,0.35)"></div>
              <div style="position: absolute; left: 18px; top: 38px; width: 40%; height: 8px; border-radius: 3px; background: rgba(255,255,255,0.2)"></div>
              <div style="position: absolute; left: 18px; top: 64px; width: 46%; height: 16px; border-radius: 3px; background: rgba(255,214,0,0.55)"></div>
              <sc-if value="{{s.starred}}" hint-placeholder-val="{{ false }}">
                <div style="position: absolute; right: 10px; top: 10px; color: #ffd166"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg></div>
              </sc-if>
            </div>
            <div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 3px">
              <div style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.title}}</div>
              <div style="font-size: 12px; color: #a8a8a8">{{s.meta}}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7fd36a","options":["#7fd36a","#4cc2ff","#ffb454","#c49cff"]},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#7fd36a',
      apps: [
        { name: 'Firefox', count: 412 },
        { name: 'Editor', count: 301 },
        { name: 'Discord', count: 188 },
        { name: 'Explorer', count: 97 },
        { name: 'Jellyfin', count: 44 }
      ],
      shots: [
        { title: 'Firefox - Billing portal', meta: 'Today 9:14 · 1280 × 720', bg: '#33475c', starred: true },
        { title: 'Editor - invoice.rs', meta: 'Yesterday 16:02 · 940 × 610', bg: '#2a2f38', starred: false },
        { title: 'Discord - #finance', meta: 'Nov 3 · 812 × 430', bg: '#3a3557', starred: false },
        { title: 'Explorer - Invoices', meta: 'Nov 2 · 1100 × 640', bg: '#2e3b33', starred: false },
        { title: 'Firefox - Order 4471', meta: 'Oct 29 · scrolling · 1280 × 4210', bg: '#4a3a2e', starred: true },
        { title: 'Firefox - Receipt', meta: 'Oct 21 · 620 × 880', bg: '#33475c', starred: false }
      ]
    };
  }
}
</script>
</body>
</html>
